# ==============================================================================
# The Brahmman Store - Render.com Blueprint Deployment Configuration
# ==============================================================================
services:
  # 1. Backend Web Service (Node.js + Express + MongoDB Atlas API)
  - type: web
    name: brahmman-store-api
    runtime: node
    rootDir: E-ComersDemoServer
    buildCommand: npm install
    startCommand: npm start
    plan: free
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: CORS_ORIGIN
        value: "*"

  # 2. Storefront Website (React + Vite + Tailwind Static Site)
  - type: web
    name: brahmman-store-website
    runtime: static
    rootDir: E-ComersDemoWebsite
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://thebrammanstorewebserver.onrender.com

  # 3. Phoenix Admin Portal (React + Vite + Tailwind Static Site)
  - type: web
    name: brahmman-store-admin
    runtime: static
    rootDir: E-ComersDemoAdmin
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://thebrammanstorewebserver.onrender.com
